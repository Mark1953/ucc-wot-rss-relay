{
 "name": "WoT NA RSS relay",
 "on": {"workflow_dispatch": {}},
 "permissions": {"contents": "write"},
 "concurrency": {"group": "relay", "cancel-in-progress": false},
 "jobs": {
  "fetch": {"runs-on": "ubuntu-latest", "strategy": {"fail-fast": false, "matrix": {"n": [1, 2, 3]}}, "steps": [{"name": "Fetch NA feed", "run": "UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'\necho \"runner ${{ matrix.n }} egress: $(curl -s -m 10 https://api.ipify.org || true)\"\nOK=0\nfor i in 1 2; do\n  curl -s -m 30 -A \"$UA\" -o feed.tmp -w \"try $i http=%{http_code} type=%{content_type} bytes=%{size_download}\\n\" https://worldoftanks.com/en/rss/news/ || true\n  FIRST=$(grep -o '<link>[^<]*</link>' feed.tmp | head -1) || true\n  echo \"channel link: $FIRST\"\n  if head -c 100 feed.tmp | grep -q '<?xml' && echo \"$FIRST\" | grep -q 'worldoftanks.com'; then OK=1; break; fi\n  sleep 15\ndone\nmkdir -p out\nif [ \"$OK\" = 1 ]; then mv feed.tmp out/wot_na_news.xml; echo \"RUNNER_RESULT=OK\"; else echo \"RUNNER_RESULT=FAIL\"; fi"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "feed-${{ matrix.n }}", "path": "out/wot_na_news.xml", "if-no-files-found": "ignore", "retention-days": 1}}]},
  "save": {"needs": "fetch", "if": "${{ always() }}", "runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/download-artifact@v4", "continue-on-error": true, "with": {"pattern": "feed-*", "path": "dl"}}, {"name": "Save", "run": "mkdir -p dl\nF=$(ls dl/*/wot_na_news.xml 2>/dev/null | head -1) || true\nN=$(ls dl/*/wot_na_news.xml 2>/dev/null | wc -l) || true\nif [ -n \"$F\" ]; then cp \"$F\" wot_na_news.xml; R=OK; else R=FAIL; fi\nB=$(wc -c < wot_na_news.xml 2>/dev/null || echo 0)\necho \"utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) result=$R runners_ok=$N/3 bytes=$B\" > relay_heartbeat.txt\ncat relay_heartbeat.txt\ngit config user.name 'ucc-relay'\ngit config user.email 'ucc-relay@users.noreply.github.com'\ngit add relay_heartbeat.txt\n[ -f wot_na_news.xml ] && git add wot_na_news.xml\ngit commit -m \"relay $(cat relay_heartbeat.txt)\"\ngit push"}, {"name": "Report", "run": "grep -q 'result=OK' relay_heartbeat.txt || { echo 'RESULT=NOT_NA_XML -- all runners challenged, last good feed kept'; exit 1; }\necho RESULT=NA_XML_OK"}]}
 }
}
